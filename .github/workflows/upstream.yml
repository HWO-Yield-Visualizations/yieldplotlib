name: Upstream canary

# Exercise upstream releases and the declared dependency floors.
on:
  schedule:
    - cron: "23 5 * * 1,4"   # Monday and Thursday, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  MPLBACKEND: Agg
  JAX_PLATFORMS: cpu
  # Limit Eigen threading for the JAX-based coronagraph calculations on CI CPUs.
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "1"
  PYTHONHASHSEED: "0"

jobs:
  upstream-dev:
    name: Upstream pre-releases (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install the package and upstream pre-releases
        run: |
          uv venv .venv --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[test]"
          uv pip install --python .venv/bin/python --upgrade --prerelease=allow \
            jax jaxlib numpy scipy astropy
          # Nightly-only index verified against the JAX installation docs:
          # https://docs.jax.dev/en/latest/installation.html#jax-nightly-installation
          uv pip install --python .venv/bin/python --upgrade --prerelease=allow \
            --index https://us-python.pkg.dev/ml-oss-artifacts-published/jax-public-nightly-artifacts-registry/simple/ \
            jax jaxlib
          uv pip freeze --python .venv/bin/python

      - name: Tests with warnings as errors
        run: |
          status=0
          for test_file in tests/test_*.py; do
            pytest -q -p no:cacheprovider "$test_file" || status=1
          done
          exit "$status"

  lowest-direct:
    name: Lowest direct dependencies (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install the lowest direct dependencies
        run: |
          uv venv .venv --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[test]"
          uv pip freeze --python .venv/bin/python

      - name: Tests at the dependency floors
        run: |
          status=0
          for test_file in tests/test_*.py; do
            pytest -q -p no:cacheprovider "$test_file" || status=1
          done
          exit "$status"

  report:
    name: Update the tracking issue
    needs: [upstream-dev, lowest-direct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Manual runs on other branches share the same tracking issue.
    concurrency:
      group: upstream-canary-report
      cancel-in-progress: false
    permissions:
      issues: write # This job alone maintains the canary tracking issue.
    steps:
      - name: Open, update or close the tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RESULT: ${{ needs.upstream-dev.result }}
          LOWEST_RESULT: ${{ needs.lowest-direct.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream canary failing"
          # Match the exact title and reuse closed issues on a later regression.
          issue=$(gh issue list --state all --search "\"$title\" in:title" --limit 100 \
            --json number,title,state --jq 'map(select(.title == "Upstream canary failing")) | first // empty')
          number=$(jq -r '.number // empty' <<< "$issue")
          state=$(jq -r '.state // empty' <<< "$issue")
          body=$(printf 'Upstream pre-releases: %s\nLowest direct dependencies: %s\n\nLatest run: %s\n' \
            "$UPSTREAM_RESULT" "$LOWEST_RESULT" "$RUN_URL")
          if [ "$UPSTREAM_RESULT" = "failure" ] || [ "$LOWEST_RESULT" = "failure" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body "$body"
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number"
              fi
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ "$UPSTREAM_RESULT" = "success" ] && [ "$LOWEST_RESULT" = "success" ]; then
            if [ -n "$number" ] && [ "$state" = "OPEN" ]; then
              gh issue edit "$number" --body "$body"
              gh issue close "$number" --comment "Both canary jobs are passing: $RUN_URL"
            fi
          fi
